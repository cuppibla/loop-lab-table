[project]
name = "loop-lab-table"
version = "0.1.0"
description = "Table for N — eval as the gate, self-evolution as the loop, one dinner table"
requires-python = ">=3.11"
dependencies = [
    "google-adk[eval,gcp]==2.3.0",
    "python-dotenv>=1.0",
    # level 05's broadcast.py imports fastapi directly and is served with
    # `uv run uvicorn broadcast:app`, so both are first-party deps here
    # rather than things we hope google-adk keeps pulling in.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
